user www-data;
worker_processes auto;
pid /run/nginx.pid;

events { worker_connections 4096; }

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format cache '$remote_addr - $host [$time_local] "$request" $status $body_bytes_sent '
                     'cache=$upstream_cache_status origin=$upstream_addr rt=$request_time urt=$upstream_response_time';

    include /data/cache-path.conf;
    proxy_temp_path /var/cache/nginx/kubit_tmp;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
